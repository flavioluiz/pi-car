<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiCASSO Lab - Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="concept-body pulse-theme">
    <div class="concept-shell">
        <header class="topbar">
            <a class="back-link" href="index.html">Lab</a>
            <img class="brand-wordmark" src="../../logos/picasso_name_only.png" alt="PiCASSO">
            <div class="topbar-meta">
                <span>Conceito 03</span>
                <span>Clean</span>
            </div>
        </header>

        <main class="pulse-layout">
            <section class="pulse-main">
                <div class="pulse-copy">
                    <span class="eyebrow">Conceito 03</span>
                    <h1>Uma interface mais limpa, forte no uso cotidiano e melhor para toque.</h1>
                    <p>Menos ruido visual, mais foco em acao, navegacao e estado do carro.</p>
                </div>

                <div class="pulse-now-playing">
                    <div class="pulse-art"></div>
                    <div class="pulse-track">
                        <strong>Nightcall</strong>
                        <span>Kavinsky</span>
                    </div>
                    <div class="pulse-progress">
                        <div></div>
                    </div>
                </div>
            </section>

            <section class="pulse-side">
                <article class="soft-card">
                    <span class="card-kicker">Atalhos</span>
                    <div class="shortcut-grid">
                        <button>Musica</button>
                        <button>Mapa</button>
                        <button>Radio</button>
                        <button>Veiculo</button>
                    </div>
                </article>

                <article class="soft-card">
                    <span class="card-kicker">Resumo</span>
                    <div class="summary-row">
                        <strong>74</strong>
                        <span>km/h</span>
                    </div>
                    <div class="summary-row">
                        <strong>11.2</strong>
                        <span>km/L</span>
                    </div>
                    <div class="summary-row">
                        <strong>5</strong>
                        <span>satelites</span>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
